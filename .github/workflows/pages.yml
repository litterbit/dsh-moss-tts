name: pages

# 只发布门户页（web/landing）。改 HTML 不会重编 C++、不会下载 160 MB 权重。
on:
  push:
    branches: [main]
    paths:
      - "web/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 仓库里第一次跑时自动把 Pages 打开（需要仓库允许 Actions 创建 Pages）
          enablement: true

      - name: Stage site (portal + same UI copy for the direct-connect path)
        shell: bash
        run: |
          mkdir -p _site/app
          cp -r web/landing/. _site/
          cp -r web/app/. _site/app/
          ls -la _site _site/app

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
