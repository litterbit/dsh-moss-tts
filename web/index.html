<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MOSS-TTS CPU 试听台</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee; --muted: #9aa3b2;
    --accent: #4f8cff; --ok: #35c07f; --warn: #e0a03a; --err: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; letter-spacing: .4px; }
  textarea {
    width: 100%; min-height: 92px; resize: vertical; background: #0d1016; color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; }
  .field { flex: 1 1 180px; min-width: 140px; }
  select, input[type="number"] {
    width: 100%; background: #0d1016; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font: inherit; outline: none;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
  button.primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 11px 22px;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: filter .15s;
  }
  button.primary:hover:not(:disabled) { filter: brightness(1.1); }
  button.primary:disabled { opacity: .55; cursor: default; }
  .status { color: var(--muted); font-size: 13px; }
  .status.err { color: var(--err); }
  .status.ok { color: var(--ok); }
  audio { width: 100%; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    background: #0d1016; border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--muted);
  }
  .chip b { color: var(--text); font-weight: 600; }
  .hist { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
  .hist .item {
    display: flex; align-items: center; gap: 12px; background: #0d1016; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
  }
  .hist .item:hover { border-color: var(--accent); }
  .hist .item .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .hist .item .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; margin-left: 6px; }
  .badge.clone { background: rgba(79,140,255,.16); color: #8fb6ff; }
  .badge.builtin { background: rgba(53,192,127,.14); color: #7bd6ac; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MOSS-TTS CPU 试听台</h1>
  <div class="sub">文本进、音频出；可以切换内置音色或克隆音色。底层直接调 <code>moss_tts.exe</code>（4+6 线程，RTF ≈ 0.15）。</div>

  <div class="panel">
    <label for="text">文本</label>
    <textarea id="text">你好，我是语音助手，这是一段用于试听的测试音频。今天天气不错，适合出去走走。</textarea>

    <div class="row">
      <div class="field">
        <label for="voice">音色</label>
        <select id="voice"></select>
      </div>
      <div class="field">
        <label for="seed">种子（同种子结果可复现）</label>
        <input id="seed" type="number" value="0" min="0" step="1">
      </div>
      <div class="field">
        <label for="frames">帧上限（1 帧 = 80 ms）</label>
        <input id="frames" type="number" value="375" min="8" step="8">
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="go">生成音频</button>
      <label style="margin:0; display:flex; align-items:center; gap:6px; color:var(--muted)">
        <input type="checkbox" id="greedy"> 贪心（确定但不会自然结束）
      </label>
      <label style="margin:0; display:flex; align-items:center; gap:6px; color:var(--muted)">
        <input type="checkbox" id="trim" checked> 裁掉尾部杂音
      </label>
      <span class="status" id="status">就绪</span>
    </div>

    <div class="chips" id="chips" hidden></div>
  </div>

  <div class="panel">
    <label>播放</label>
    <audio id="player" controls></audio>
    <div class="hint" id="dl" hidden>下载：<a id="dlink" href="#" download>wav</a></div>
  </div>

  <div class="panel">
    <label>最近生成</label>
    <div class="hist" id="hist"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const state = { history: [] };

function fmtMs(v) { return v == null ? "—" : `${Math.round(v)} ms`; }

async function loadVoices() {
  const res = await fetch("/api/voices");
  const data = await res.json();
  const sel = $("voice");
  sel.innerHTML = "";
  const g1 = document.createElement("optgroup");
  g1.label = `内置音色（${data.builtin.length}）`;
  for (const name of data.builtin) {
    const o = document.createElement("option");
    o.value = `builtin:${name}`;
    o.textContent = name;
    g1.appendChild(o);
  }
  sel.appendChild(g1);
  if (data.clones.length) {
    const g2 = document.createElement("optgroup");
    g2.label = `克隆音色（${data.clones.length}）`;
    for (const c of data.clones) {
      const o = document.createElement("option");
      o.value = `clone:${c.name}`;
      o.textContent = `${c.name}  ·  ${c.seconds}s 参考`;
      g2.appendChild(o);
    }
    sel.appendChild(g2);
  }
  if (data.clones.length) sel.value = `clone:${data.clones[0].name}`;
  if (!data.ready) setStatus("找不到发布包，请先运行 scripts\\pack_release.bat", "err");
}

function setStatus(text, kind = "") {
  const el = $("status");
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

async function generate() {
  const raw = $("voice").value;
  const [kind, voice] = raw.split(":");
  const text = $("text").value.trim();
  if (!text) { setStatus("文本为空", "err"); return; }

  $("go").disabled = true;
  setStatus("生成中…（首次会加载权重，约 0.1 s）");
  try {
    const res = await fetch("/api/synth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text, voice, kind,
        seed: Number($("seed").value) || 0,
        greedy: $("greedy").checked,
        trim: $("trim").checked,
        frames: Number($("frames").value) || 375,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    const s = data.stats;
    const player = $("player");
    player.src = data.url;
    player.play().catch(() => {});
    $("dl").hidden = false;
    $("dlink").href = data.url;
    $("dlink").download = `${voice}.wav`;

    renderChips(s);
    setStatus(`完成：${s.frames} 帧 / ${Number(s.audio_seconds).toFixed(2)} s，RTF ${Number(s.rtf).toFixed(3)}`, "ok");
    pushHistory({ text, voice, kind, url: data.url, stats: s });
  } catch (err) {
    setStatus(`失败：${err.message}`, "err");
  } finally {
    $("go").disabled = false;
  }
}

function renderChips(s) {
  const chips = $("chips");
  chips.hidden = false;
  const items = [
    ["音色", s.voice + (s.kind === "clone" ? "（克隆）" : "")],
    ["帧数", s.frames],
    ["音频", `${Number(s.audio_seconds).toFixed(2)} s`],
    ["首音", fmtMs(s.first_audio_ms)],
    ["总耗时", fmtMs(s.total_ms)],
    ["RTF", Number(s.rtf).toFixed(3)],
    ...(s.trimmed_seconds ? [["裁掉", `${Number(s.trimmed_seconds).toFixed(2)} s`]] : []),
    ["prefill", fmtMs(s.prefill_ms)],
    ["解码", fmtMs(s.decode_ms)],
    ["文本 token", s.text_tokens],
  ];
  chips.innerHTML = items.map(([k, v]) => `<span class="chip">${k} <b>${v}</b></span>`).join("");
}

function pushHistory(item) {
  state.history.unshift(item);
  state.history = state.history.slice(0, 8);
  const hist = $("hist");
  hist.innerHTML = "";
  for (const h of state.history) {
    const el = document.createElement("div");
    el.className = "item";
    const badge = h.kind === "clone" ? '<span class="badge clone">克隆</span>' : '<span class="badge builtin">内置</span>';
    el.innerHTML = `<span class="txt"></span><span class="meta">${h.stats.frames} 帧 · ${Number(h.stats.audio_seconds).toFixed(2)}s · RTF ${Number(h.stats.rtf).toFixed(3)}</span>`;
    el.querySelector(".txt").textContent = `${h.voice}${badge} ${h.text}`;
    el.onclick = () => {
      $("player").src = h.url;
      $("player").play().catch(() => {});
      renderChips(h.stats);
    };
    hist.appendChild(el);
  }
}

$("go").onclick = generate;
$("text").addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") generate();
});
loadVoices();
</script>
</body>
</html>
